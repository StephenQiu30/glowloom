syntax = "proto3";

package glowloom.identity;

import "glowloom/coordination/writer.proto";

option go_package = "github.com/StephenQiu30/glowloom-server/backend/internal/contract/gen/identity;identity";

// Authority is private to authenticated owner processes. Verification proves only
// current account/session identity, never resource permission or write admission.
service Authority {
  rpc Verify(VerifyRequest) returns (VerifyResponse);
  // Reads current exact source generations without activity, admission or writes.
  // Credential epoch is never a substitute for either authority generation.
  rpc ReadSessionAuthorities(ReadSessionAuthoritiesRequest) returns (ReadSessionAuthoritiesResponse);
  // Explicit owner-selected foreground handler purposes only. Verification,
  // command admission, streams, previews, status and polling never call this.
  rpc RecordForegroundActivity(RecordForegroundActivityRequest) returns (RecordForegroundActivityResponse);
  // Admission binds the complete original command under Identity policy locks.
  // Creation policy and the effect owner's final transaction fence remain required.
  rpc AdmitSessionCommand(AdmitSessionCommandRequest) returns (AdmitSessionCommandResponse);
  // Only Creation may verify a prior effect-owner admission. This read cannot
  // register new work, open heads, grant resource policy or prove business commit.
  rpc ResolveAdmission(ResolveAdmissionRequest) returns (ResolveAdmissionResponse);
  // Creation-only retained-resource governance; no session or general write grant.
  rpc ReadAccountQualificationIntent(ReadAccountQualificationIntentRequest) returns (ReadAccountQualificationIntentResponse);
  rpc IssueTeamAdministratorQualification(IssueTeamAdministratorQualificationRequest) returns (TeamAdministratorQualificationResponse);
  // Explicit new qualification read. Old proof/command and candidate set stay fixed.
  rpc RefreshTeamAdministratorQualification(RefreshTeamAdministratorQualificationRequest) returns (TeamAdministratorQualificationResponse);
  rpc ResolveTeamAdministratorQualification(ResolveTeamAdministratorQualificationRequest) returns (TeamAdministratorQualificationResponse);
}

enum AccountQualificationAction {
  ACCOUNT_QUALIFICATION_ACTION_UNSPECIFIED = 0;
  ACCOUNT_QUALIFICATION_ACTION_DISABLE = 1;
  ACCOUNT_QUALIFICATION_ACTION_ENABLE = 2;
  ACCOUNT_QUALIFICATION_ACTION_DELETE = 3;
}
message AccountQualificationIntent {
  bytes request_id = 1;
  bytes account_id = 2;
  AccountQualificationAction action = 3;
  string input_sha256 = 4;
  glowloom.coordination.Control close_control = 5;
  bool eligible_after = 6;
}
message ReadAccountQualificationIntentRequest {
  glowloom.coordination.Writer caller = 1;
  bytes request_id = 2;
}
message ReadAccountQualificationIntentResponse {
  AccountQualificationIntent intent = 1;
}
message IssueTeamAdministratorQualificationRequest {
  glowloom.coordination.Writer caller = 1;
  bytes request_id = 2;
  bytes team_id = 3;
  bytes candidate_id = 4;
  string snapshot_sha256 = 5;
}
message RefreshTeamAdministratorQualificationRequest {
  glowloom.coordination.Writer caller = 1;
  bytes request_id = 2;
  bytes team_id = 3;
  bytes candidate_id = 4;
  string snapshot_sha256 = 5;
  bytes previous_proof_id = 6;
}
message ResolveTeamAdministratorQualificationRequest {
  glowloom.coordination.Writer caller = 1;
  bytes proof_id = 2;
}
message TeamAdministratorQualification {
  bytes id = 1;
  bytes previous_proof_id = 2;
  AccountQualificationIntent intent = 3;
  bytes team_id = 4;
  bytes candidate_id = 5;
  string snapshot_sha256 = 6;
  bool eligible = 7;
  glowloom.coordination.Control control = 8;
  glowloom.coordination.Command command = 9;
  glowloom.coordination.Writer target = 10;
}
message TeamAdministratorQualificationResponse {
  TeamAdministratorQualification proof = 1;
}

// Raw credentials exist only in this private request. They must never be logged,
// returned, persisted or forwarded to another owner. Refresh is deliberately absent.
message Credential {
  oneof proof {
    string legacy_token = 1;
    string access_token = 2;
  }
  string csrf_token = 3;
}

message Identity {
  bytes account_id = 1;
  bytes session_id = 2;
  int64 credential_epoch = 3;
}

message VerifyRequest {
  glowloom.coordination.Writer caller = 1;
  Credential credential = 2;
}

message VerifyResponse {
  Identity identity = 1;
}

message ReadSessionAuthoritiesRequest {
  glowloom.coordination.Writer caller = 1;
  Credential credential = 2;
}

// A read snapshot is not a command admission or an effect-owner write permit.
// Both fields name the authenticated identity and the current complete/open heads.
message ReadSessionAuthoritiesResponse {
  Identity identity = 1;
  glowloom.coordination.Authority account = 2;
  glowloom.coordination.Authority session = 3;
}

// Closed trusted handler classes; there is deliberately no generic user-activity
// boolean, arbitrary route/header input, preview, stream or polling purpose.
enum ForegroundPurpose {
  FOREGROUND_PURPOSE_UNSPECIFIED = 0;
  FOREGROUND_PURPOSE_PROFILE_READ = 1;
  FOREGROUND_PURPOSE_PROFILE_WRITE = 2;
  FOREGROUND_PURPOSE_PREFERENCES_READ = 3;
  FOREGROUND_PURPOSE_PREFERENCES_WRITE = 4;
  FOREGROUND_PURPOSE_SESSIONS_READ = 5;
  FOREGROUND_PURPOSE_REAUTHENTICATION = 6;
  FOREGROUND_PURPOSE_SPACES_READ = 7;
  FOREGROUND_PURPOSE_PROJECT_READ = 8;
  FOREGROUND_PURPOSE_PROJECT_WRITE = 9;
  FOREGROUND_PURPOSE_FOLDER_READ = 10;
  FOREGROUND_PURPOSE_FOLDER_WRITE = 11;
  FOREGROUND_PURPOSE_TEAM_READ = 12;
  FOREGROUND_PURPOSE_TEAM_WRITE = 13;
  FOREGROUND_PURPOSE_CONTENT_WRITE = 14;
  FOREGROUND_PURPOSE_MODEL_DEFAULTS_READ = 15;
  FOREGROUND_PURPOSE_STYLE_PRESETS_READ = 16;
  FOREGROUND_PURPOSE_MEDIA_LIBRARY_READ = 17;
  FOREGROUND_PURPOSE_MODEL_LIST = 18;
}

message RecordForegroundActivityRequest {
  glowloom.coordination.Writer caller = 1;
  Credential credential = 2;
  ForegroundPurpose purpose = 3;
}

// Acknowledges current identity only. No credential, resource permission,
// command admission or new expiry is returned to the caller.
message RecordForegroundActivityResponse {
  Identity identity = 1;
}

message AdmitSessionCommandRequest {
  glowloom.coordination.Writer caller = 1;
  Credential credential = 2;
  glowloom.coordination.Command command = 3;
  glowloom.coordination.Writer target = 4;
}

// Acknowledges only the exact command registered for the authenticated writer.
// This is neither an execution permit nor a replacement for a final-write fence.
message AdmitSessionCommandResponse {
  Identity identity = 1;
  glowloom.coordination.Command command = 2;
  glowloom.coordination.Writer target = 3;
}

// The caller must present the entire original identity, not an enumerable ID or
// caller-supplied Principal. There are deliberately no raw credentials here.
message ResolveAdmissionRequest {
  glowloom.coordination.Writer caller = 1;
  glowloom.coordination.Command command = 2;
  glowloom.coordination.Writer target = 3;
}

// AdmissionProof acknowledges existing Identity admission while its exact policy
// generations are still usable. Creation and the effect owner remain responsible
// for their own admission and final-write transactions after this read completes.
message AdmissionProof {
  Identity identity = 1;
  glowloom.coordination.Command command = 2;
  glowloom.coordination.Writer target = 3;
}

message ResolveAdmissionResponse {
  AdmissionProof proof = 1;
}
