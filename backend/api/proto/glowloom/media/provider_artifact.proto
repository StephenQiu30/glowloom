syntax = "proto3";
package glowloom.media;
option go_package = "github.com/StephenQiu30/glowloom-server/backend/internal/contract/gen/mediaartifact;mediaartifact";
import "glowloom/coordination/writer.proto";

// ProviderArtifacts owns original bytes, not an operation result or money effect.
service ProviderArtifacts {
 rpc StageProviderArtifact(ProviderArtifactRequest) returns (ProviderArtifactReceipt);
 rpc ResolveProviderArtifact(ProviderArtifactRequest) returns (ProviderArtifactReceipt);
 rpc ReadProviderArtifact(ProviderArtifactRequest) returns (stream ProviderArtifactChunk);
}
// ArtifactSources is Execution's read-only persisted and attempted chunk source.
service ArtifactSources {
 rpc VerifyProviderArtifactSource(ProviderArtifactRequest) returns (ProviderArtifactRequest);
 rpc ReadProviderArtifactSource(ProviderArtifactRequest) returns (stream ProviderArtifactChunk);
}
message ProviderArtifactRequest {
 glowloom.coordination.Command command = 1;
 bytes delivery_id = 2;
 bytes provider_call_id = 3;
 string provider_call_created_at = 4;
 bytes operation_id = 5;
 bytes project_id = 6;
 string call_action = 7;
 int32 call_attempt = 8;
 string request_key = 9;
 int32 sequence = 10;
 int64 byte_size = 11;
 string sha256 = 12;
 string manifest_sha256 = 13;
 string mime = 14;
 string processing = 15;
}
message ProviderArtifactReceipt {
 ProviderArtifactRequest request = 1;
 bytes artifact_id = 2;
 string state = 3;
 ProviderArtifactDescriptor canonical = 4;
}
message ProviderArtifactDescriptor {
 int64 byte_size = 1;
 string sha256 = 2;
 string mime = 3;
 int64 duration_ms = 4;
}
message ProviderArtifactChunk {
 int32 sequence = 1;
 bytes data = 2;
}
