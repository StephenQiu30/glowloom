syntax = "proto3";
package glowloom.execution;
option go_package = "github.com/StephenQiu30/glowloom-server/backend/internal/contract/gen/execution;execution";

// ProjectBudgets is Execution's private zero-credit bootstrap participant.
// Only the Creation service may prepare/resolve its own original responsibility;
// this is not a remote Billing service or a user spending permission.
service ProjectBudgets {
  rpc PrepareProjectBudget(ProjectBudgetPreparation) returns (ProjectBudgetReceipt);
  rpc ResolveProjectBudget(ProjectBudgetPreparation) returns (ProjectBudgetReceipt);
}
message ProjectBudgetPreparation {
  bytes execution_command_id = 1;
  bytes preparation_id = 2;
  bytes source_command_id = 3;
  string source_sha256 = 4;
  string input_sha256 = 5;
  bytes project_id = 6;
  bytes organization_id = 7;
  bytes scope_id = 8;
}
message ProjectBudgetReceipt {
  ProjectBudgetPreparation original = 1;
  bytes budget_id = 2;
  int64 budget_revision = 3;
  int64 limit_micros = 4;
  int64 spent_micros = 5;
  int64 reserved_micros = 6;
  bool wallet_prepared = 7;
}
