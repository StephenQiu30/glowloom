syntax = "proto3";

package glowloom.creation;

import "glowloom/identity/authority.proto";
import "glowloom/coordination/writer.proto";

option go_package = "github.com/StephenQiu30/glowloom-server/backend/internal/contract/gen/creationgovernance;creationgovernance";

// AccountGovernance owns only Creation team/member effects. Identity remains the
// source of account qualification; this service receives no browser credentials.
service AccountGovernance {
  rpc Prepare(PrepareAccountGovernanceRequest) returns (AccountGovernanceResponse);
  // Resolve resumes only an existing immutable responsibility.
  rpc Resolve(ResolveAccountGovernanceRequest) returns (AccountGovernanceResponse);
}
message PrepareAccountGovernanceRequest {
  glowloom.identity.AccountQualificationIntent intent = 1;
}
message ResolveAccountGovernanceRequest {
  bytes request_id = 1;
}
enum AccountGovernanceVerdict {
  ACCOUNT_GOVERNANCE_VERDICT_UNSPECIFIED = 0;
  ACCOUNT_GOVERNANCE_VERDICT_READY = 1;
  ACCOUNT_GOVERNANCE_VERDICT_REJECTED_DUTIES = 2;
}
message AccountGovernanceReceipt {
  bytes request_id = 1;
  bytes account_id = 2;
  glowloom.identity.AccountQualificationAction action = 3;
  string input_sha256 = 4;
  glowloom.coordination.Control identity_close = 5;
  AccountGovernanceVerdict verdict = 6;
  repeated bytes team_ids = 7;
  repeated bytes blocking_team_ids = 8;
}
message AccountGovernanceResponse {
  AccountGovernanceReceipt receipt = 1;
}
