syntax = "proto3";

package glowloom.creation;

option go_package = "github.com/StephenQiu30/glowloom-server/backend/internal/contract/gen/creationpreparation;creationpreparation";

// Execution alone reads original durable Creation facts before preparing its
// zero-credit project wallet/budget. This is neither actor admission nor a write
// permit and never reports a public intermediate project state.
service ProjectPreparations {
  rpc ResolveProjectPreparation(ProjectPreparationKey) returns (ProjectPreparedProof);
}

message ProjectPreparationKey {
  bytes preparation_id = 1;
  bytes source_command_id = 2;
  string source_sha256 = 3;
  string input_sha256 = 4;
  bytes execution_command_id = 5;
  bytes project_id = 6;
  bytes organization_id = 7;
  bytes scope_id = 8;
}

message ProjectPreparedProof {
  ProjectPreparationKey request = 1;
  // "prepared" proves only that the exact original hidden source facts exist.
  string phase = 2;
}
