syntax = "proto3";
package glowloom.creation;
option go_package = "github.com/StephenQiu30/glowloom-server/backend/internal/contract/gen/creation;creation";

// Only the dedicated Identity service identity may prepare an accepted registration.
// No password, grant, email, credential or user-supplied authority travels here.
service PersonalRegistration {
  rpc Prepare(PersonalRegistrationRequest) returns (PersonalRegistrationReceipt);
  rpc Resolve(PersonalRegistrationRequest) returns (PersonalRegistrationReceipt);
}
message PersonalRegistrationRequest {
  bytes operation_id = 1;
  bytes account_id = 2;
  bytes organization_id = 3;
  bytes scope_id = 4;
  string input_sha256 = 5;
}
message PersonalRegistrationReceipt {
  PersonalRegistrationRequest command = 1;
}
