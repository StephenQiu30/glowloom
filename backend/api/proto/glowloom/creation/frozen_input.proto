syntax = "proto3";
package glowloom.creation;
option go_package = "github.com/StephenQiu30/glowloom-server/backend/internal/contract/gen/creationhandoff;creationhandoff";
import "glowloom/coordination/writer.proto";

// Private source responsibility. Only authenticated Execution may freeze/resolve.
// Freeze authenticates the original Identity admission; service identity alone
// never grants project access or accepts a caller-supplied Principal.
service FrozenInputs {
 rpc ResolveFrozenInput(FrozenInputKey) returns (FrozenInput);
 rpc FreezeFrozenInput(FreezeFrozenInputRequest) returns (FrozenInput);
 rpc CompileFrozenInput(CompileFrozenInputRequest) returns (FrozenInputCompilation);
}
// Exact immutable selection. Account/session are resolved from the authenticated
// original command proof, never supplied as independent caller identity fields.
message FreezeFrozenInputRequest {
 bytes handoff_id = 1;
 bytes request_id = 2;
 glowloom.coordination.Command command = 3;
 glowloom.coordination.Command source_command = 4;
 bytes scope_id = 5;
 bytes project_id = 6;
 FrozenInputSource source = 7;
 int64 source_generation = 8;
 int64 expected_scope_revision = 9;
 int64 expected_project_revision = 10;
 repeated FrozenInputPin pins = 11;
 FrozenTemplateSelection template_selection = 12;
}
message FrozenTemplateSelection {
 string operation = 1;
 bytes expected_template_id = 2;
 optional int64 expected_customization_revision = 3;
 FrozenOutlineOptions outline = 4;
}
message FrozenOutlineOptions {
 string chapter_count = 1;
 string structure = 2;
 string word_count = 3;
 string perspective = 4;
 string tone = 5;
 string character_scale = 6;
 string chapter_length = 7;
}
// Catalog owns these immutable facts; Creation validates them against its saved
// draft and performs the only prompt/reference compilation.
message FrozenCatalogContext {
 bytes model_version_id = 1;
 string model_key = 2;
 string capability = 3;
 string mode = 4;
}
message CompileFrozenInputRequest {
 FrozenInputKey key = 1;
 FrozenCatalogContext catalog_context = 2;
}
message FrozenCompiledMedia {
 int32 seq_no = 1;
 bytes media_asset_id = 2;
 string role = 3;
 bytes subject_binding_id = 4;
 string subject_binding_sha256 = 5;
}
message FrozenReferenceMapping {
 string reference_id = 1;
 string label = 2;
 repeated int32 media_seq_nos = 3;
 string role = 4;
}
message FrozenTemplateEvidence {
 int32 version = 1;
 string operation = 2;
 string policy = 3;
 bytes template_id = 4;
 int32 template_version = 5;
 bytes customization_id = 6;
 int64 customization_revision = 7;
 string request_sha256 = 8;
 string user_prompt_sha256 = 9;
 string content_sha256 = 10;
}
message FrozenInputCompilation {
 FrozenInputKey key = 1;
 FrozenCatalogContext catalog_context = 2;
 string context_sha256 = 3;
 string compilation_sha256 = 4;
 bytes model_version_id = 5;
 string mode = 6;
 string original_prompt = 7;
 string final_prompt = 8;
 bytes params_json = 9;
 int32 output_count = 10;
 repeated FrozenCompiledMedia media = 11;
 string compiler_version = 12;
 repeated FrozenReferenceMapping reference_mapping = 13;
 FrozenTemplateEvidence template_evidence = 14;
 // Typed fields must match this complete canonical immutable receipt.
 bytes canonical_compilation_json = 15;
}
// Private Execution consumer. Only authenticated Creation may deliver or close.
service FrozenInputConsumer {
 rpc AcceptFrozenInput(FrozenInputKey) returns (FrozenInputAcceptance);
 rpc CancelFrozenInput(CancelFrozenInputRequest) returns (FrozenInputCancellation);
}
message FrozenInputKey {
 bytes handoff_id = 1;
 bytes command_id = 2;
 string command_sha256 = 3;
 string snapshot_sha256 = 4;
}
message FrozenInputSource {
 string kind = 1;
 bytes draft_id = 2;
 int64 revision = 3;
 bytes canvas_id = 4;
 bytes node_id = 5;
 int64 canvas_revision = 6;
 int64 input_revision = 7;
}
message FrozenInputPin {
 string reference_id = 1;
 bytes pin_id = 2;
 bytes acquire_command_id = 3;
 bytes asset_id = 4;
 int64 asset_revision = 5;
 string kind = 6;
 string snapshot_sha256 = 7;
}
message FrozenInput {
 FrozenInputKey key = 1;
 bytes request_id = 2;
 glowloom.coordination.Command command = 3;
 bytes actor_id = 4;
 bytes session_id = 5;
 bytes scope_id = 6;
 bytes project_id = 7;
 FrozenInputSource source = 8;
 int64 source_generation = 9;
 int64 draft_revision = 10;
 int64 scope_revision = 11;
 int64 project_revision = 12;
 int64 team_epoch = 13;
 int64 member_epoch = 14;
 string draft_hash = 15;
 string input_hash = 16;
 repeated FrozenInputPin pins = 17;
 // Complete canonical closed Creation snapshot, including the validated draft.
 // Every typed metadata field must match this content before it is consumed.
 bytes canonical_snapshot_json = 18;
 bool adoption_blocked = 19;
 glowloom.coordination.Command cancel_command = 20;
 // Distinct Creation-local effect identity; never substitutes for target admission.
 glowloom.coordination.Command source_command = 21;
 // Physical organization read from Creation's locked project, never scope/caller input.
 bytes org_id = 22;
 // Frozen project setting used by Execution/Media; never inferred from a default.
 string aspect_ratio = 23;
}
message FrozenInputAcceptance {
 FrozenInputKey key = 1;
 bytes request_id = 2;
 bytes operation_id = 3;
 bytes submission_id = 4;
 bytes receipt_id = 5;
}
message CancelFrozenInputRequest {
 FrozenInputKey key = 1;
 glowloom.coordination.Command cancel_command = 2;
}
enum FrozenInputCancellationOutcome {
 FROZEN_INPUT_CANCELLATION_OUTCOME_UNSPECIFIED = 0;
 FROZEN_INPUT_CANCELLATION_OUTCOME_NOT_RECEIVED_FROZEN = 1;
 FROZEN_INPUT_CANCELLATION_OUTCOME_CANCELLED_INPUT = 2;
}
message FrozenInputCancellation {
 FrozenInputKey key = 1;
 bytes cancel_command_id = 2;
 FrozenInputCancellationOutcome outcome = 3;
 glowloom.coordination.ResolveResponse original = 4;
}
enum FrozenInputErrorReason {
 FROZEN_INPUT_ERROR_REASON_UNSPECIFIED = 0;
 FROZEN_INPUT_ERROR_REASON_INVALID = 1;
 FROZEN_INPUT_ERROR_REASON_CONFLICT = 2;
 FROZEN_INPUT_ERROR_REASON_FENCED = 3;
 FROZEN_INPUT_ERROR_REASON_CANCELLED = 4;
 FROZEN_INPUT_ERROR_REASON_NOT_FOUND = 5;
 FROZEN_INPUT_ERROR_REASON_WRONG_OWNER = 6;
 FROZEN_INPUT_ERROR_REASON_UNAVAILABLE = 7;
 FROZEN_INPUT_ERROR_REASON_EXECUTION_RESERVED = 8;
 FROZEN_INPUT_ERROR_REASON_TEMPLATE_INVALID = 9;
 FROZEN_INPUT_ERROR_REASON_TEMPLATE_CHANGED = 10;
 FROZEN_INPUT_ERROR_REASON_TEMPLATE_CONTEXT_UNAVAILABLE = 11;
 FROZEN_INPUT_ERROR_REASON_UNSUPPORTED_COMPILER = 12;
 FROZEN_INPUT_ERROR_REASON_SOURCE_STALE = 13;
 FROZEN_INPUT_ERROR_REASON_REFERENCE_UNAVAILABLE = 14;
}
message FrozenInputFailure { FrozenInputErrorReason reason = 1; }
