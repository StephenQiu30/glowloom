# Development application stack; existing host middleware retains its data.
# Start/update applications: docker compose up -d --build
name: glowloom

services:
  frontend:
    container_name: glowloom-frontend
    build:
      context: ./frontend
      target: dev
    image: glowloom/frontend:latest
    init: true
    restart: unless-stopped
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      GLOWLOOM_BACKEND_ORIGIN: "http://backend:18080"
      GLOWLOOM_PUBLIC_ORIGIN: ${GLOWLOOM_PUBLIC_ORIGIN-${LV_PUBLIC_ORIGIN:-http://127.0.0.1:${GLOWLOOM_FRONTEND_PORT-${LV_FRONTEND_PORT:-3200}}}}
      NODE_OPTIONS: "--max-old-space-size=2048"
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
      - ./frontend/next.config.ts:/app/next.config.ts:ro
      - ./frontend/tsconfig.json:/app/tsconfig.json:ro
      - ./frontend/postcss.config.mjs:/app/postcss.config.mjs:ro
      - ./frontend/package.json:/app/package.json:ro
      - ./frontend/pnpm-lock.yaml:/app/pnpm-lock.yaml:ro
      - ./frontend/pnpm-workspace.yaml:/app/pnpm-workspace.yaml:ro
      - ./frontend/eslint.config.mjs:/app/eslint.config.mjs:ro
      - ./frontend/tests:/app/tests:ro
      - frontend-modules:/app/node_modules
      - frontend-next:/app/.next
    ports:
      - "127.0.0.1:${GLOWLOOM_FRONTEND_PORT-${LV_FRONTEND_PORT:-3200}}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s

  backend:
    container_name: glowloom-backend
    build:
      context: ./backend
      target: dev
    image: glowloom/backend:latest
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/src:ro
      - backend-go-build:/go/build-cache
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8080/healthz && curl -fsS http://127.0.0.1:8081/healthz && curl -fsS http://127.0.0.1:8082/healthz",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 180s
    command: ["--role=all"]
    tmpfs:
      - /work:rw,noexec,nosuid,size=8g
    environment:
      GLOWLOOM_HOST_SERVICE_PORTS: ${GLOWLOOM_HOST_SERVICE_PORTS-${LV_HOST_SERVICE_PORTS:-5432 6379 7233 9000 9092}}
      GLOWLOOM_ENV: ${GLOWLOOM_ENV-${LV_ENV:-local}}
      GLOWLOOM_LOG_LEVEL: ${GLOWLOOM_LOG_LEVEL-${LV_LOG_LEVEL:-info}}
      GLOWLOOM_DEV_API_PROXY: "true"
      GLOWLOOM_WORKER_HEALTH_ADDR: ":8081"
      GLOWLOOM_RELAY_HEALTH_ADDR: ":8082"
      GLOWLOOM_KAFKA_BROKERS: ${GLOWLOOM_KAFKA_BROKERS-${LV_KAFKA_BROKERS:?Set GLOWLOOM_KAFKA_BROKERS for the backend relay}}
      GLOWLOOM_WHISPER_ENDPOINT: ${GLOWLOOM_WHISPER_ENDPOINT-${LV_WHISPER_ENDPOINT:-}}
      GLOWLOOM_MEDIA_RESULT_ALLOWED_ORIGINS: ${GLOWLOOM_MEDIA_RESULT_ALLOWED_ORIGINS-${LV_MEDIA_RESULT_ALLOWED_ORIGINS:-}}
      GLOWLOOM_MEDIA_ALLOW_TEST_LOOPBACK_TLS: ${GLOWLOOM_MEDIA_ALLOW_TEST_LOOPBACK_TLS-${LV_MEDIA_ALLOW_TEST_LOOPBACK_TLS:-false}}
      GLOWLOOM_HTTP_ADDR: "127.0.0.1:8080"
      GLOWLOOM_PUBLIC_ORIGIN: ${GLOWLOOM_PUBLIC_ORIGIN-${LV_PUBLIC_ORIGIN:-http://127.0.0.1:${GLOWLOOM_FRONTEND_PORT-${LV_FRONTEND_PORT:-3200}}}}
      GLOWLOOM_IDENTITY_SESSION_V2_ENABLED: ${GLOWLOOM_IDENTITY_SESSION_V2_ENABLED-${LV_IDENTITY_SESSION_V2_ENABLED:-false}}
      GLOWLOOM_IDENTITY_LEGACY_UPGRADE_UNTIL: ${GLOWLOOM_IDENTITY_LEGACY_UPGRADE_UNTIL-${LV_IDENTITY_LEGACY_UPGRADE_UNTIL:-}}
      GLOWLOOM_IDENTITY_KEY: ${GLOWLOOM_IDENTITY_KEY-${LV_IDENTITY_KEY:?Set GLOWLOOM_IDENTITY_KEY JSON in .env}}
      GLOWLOOM_IDENTITY_JWT_PRIVATE_KEY: ${GLOWLOOM_IDENTITY_JWT_PRIVATE_KEY-${LV_IDENTITY_JWT_PRIVATE_KEY:-}}
      GLOWLOOM_IDENTITY_JWT_VERIFY_KEYS: ${GLOWLOOM_IDENTITY_JWT_VERIFY_KEYS-${LV_IDENTITY_JWT_VERIFY_KEYS:-}}
      GLOWLOOM_IDENTITY_REFRESH_RECEIPT_KEY: ${GLOWLOOM_IDENTITY_REFRESH_RECEIPT_KEY-${LV_IDENTITY_REFRESH_RECEIPT_KEY:-}}
      GLOWLOOM_IDENTITY_JWT_ACTIVE_KID: ${GLOWLOOM_IDENTITY_JWT_ACTIVE_KID-${LV_IDENTITY_JWT_ACTIVE_KID:-}}
      GLOWLOOM_IDENTITY_TERMS_VERSION: ${GLOWLOOM_IDENTITY_TERMS_VERSION-${LV_IDENTITY_TERMS_VERSION:-}}
      GLOWLOOM_IDENTITY_MAIL_SOURCE_HOURLY_LIMIT: ${GLOWLOOM_IDENTITY_MAIL_SOURCE_HOURLY_LIMIT-${LV_IDENTITY_MAIL_SOURCE_HOURLY_LIMIT:-0}}
      GLOWLOOM_IDENTITY_MAIL_GLOBAL_HOURLY_LIMIT: ${GLOWLOOM_IDENTITY_MAIL_GLOBAL_HOURLY_LIMIT-${LV_IDENTITY_MAIL_GLOBAL_HOURLY_LIMIT:-0}}
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:-tls}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Glowloom}
      GLOWLOOM_DB_DSN: ${GLOWLOOM_DB_DSN-${LV_DB_DSN:?Set GLOWLOOM_DB_DSN for the backend API}}
      GLOWLOOM_REDIS_URL: ${GLOWLOOM_REDIS_URL-${LV_REDIS_URL:?Set GLOWLOOM_REDIS_URL for the backend API}}
      GLOWLOOM_SESSION_IDLE_TTL: ${GLOWLOOM_SESSION_IDLE_TTL-${LV_SESSION_IDLE_TTL:-12h}}
      GLOWLOOM_SESSION_ABSOLUTE_TTL: ${GLOWLOOM_SESSION_ABSOLUTE_TTL-${LV_SESSION_ABSOLUTE_TTL:-168h}}
      GLOWLOOM_TEMPORAL_ADDR: ${GLOWLOOM_TEMPORAL_ADDR-${LV_TEMPORAL_ADDR:?Set GLOWLOOM_TEMPORAL_ADDR for the backend API}}
      GLOWLOOM_TEMPORAL_NAMESPACE: ${GLOWLOOM_TEMPORAL_NAMESPACE-${LV_TEMPORAL_NAMESPACE:?Set GLOWLOOM_TEMPORAL_NAMESPACE for the backend API}}
      GLOWLOOM_OBJECT_STORAGE_ENDPOINT: ${GLOWLOOM_OBJECT_STORAGE_ENDPOINT-${LV_OBJECT_STORAGE_ENDPOINT:?Set GLOWLOOM_OBJECT_STORAGE_ENDPOINT for the backend API}}
      GLOWLOOM_OBJECT_STORAGE_BUCKET: ${GLOWLOOM_OBJECT_STORAGE_BUCKET-${LV_OBJECT_STORAGE_BUCKET:?Set GLOWLOOM_OBJECT_STORAGE_BUCKET for the backend API}}
      GLOWLOOM_OBJECT_STORAGE_ACCESS_KEY: ${GLOWLOOM_OBJECT_STORAGE_ACCESS_KEY-${LV_OBJECT_STORAGE_ACCESS_KEY:?Set GLOWLOOM_OBJECT_STORAGE_ACCESS_KEY for the backend API}}
      GLOWLOOM_OBJECT_STORAGE_SECRET_KEY: ${GLOWLOOM_OBJECT_STORAGE_SECRET_KEY-${LV_OBJECT_STORAGE_SECRET_KEY:?Set GLOWLOOM_OBJECT_STORAGE_SECRET_KEY for the backend API}}
      GLOWLOOM_OBJECT_STORAGE_REGION: ${GLOWLOOM_OBJECT_STORAGE_REGION-${LV_OBJECT_STORAGE_REGION:-}}
      GLOWLOOM_OTEL_ENDPOINT: ${GLOWLOOM_OTEL_ENDPOINT-${LV_OTEL_ENDPOINT:-}}
    ports:
      - "127.0.0.1:${GLOWLOOM_BACKEND_PORT-${LV_BACKEND_PORT:-8080}}:18080"

      - "127.0.0.1:${GLOWLOOM_WORKER_HEALTH_PORT-${LV_WORKER_HEALTH_PORT:-8081}}:8081"
      - "127.0.0.1:${GLOWLOOM_RELAY_HEALTH_PORT-${LV_RELAY_HEALTH_PORT:-8082}}:8082"

volumes:
  backend-go-build:
  frontend-modules:
    name: glowloom-dev_frontend-modules
    external: true
  frontend-next:
    name: glowloom-dev_frontend-next
    external: true
