# Local application stack; existing host middleware retains its data.
# Single project entry point: docker compose up -d --build --wait
# Fixed host ports: frontend 1122, backend 1123. Resolve host conflicts before starting.
name: glowloom

services:
  agent:
    build:
      context: ./agent
    image: glowloom/agent:current
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 35s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      GLOWLOOM_AGENT_HTTP_ADDR: 0.0.0.0:4401
      GLOWLOOM_AGENT_BUSINESS_ORIGIN: http://backend:18080
      GLOWLOOM_AGENT_DB_DSN: ${GLOWLOOM_AGENT_DB_DSN:?Set the restricted glowloom_agent PostgreSQL DSN}
      GLOWLOOM_AGENT_SERVICE_TOKEN: ${GLOWLOOM_AGENT_SERVICE_TOKEN:?Set a separate Go-to-Agent token of at least 32 bytes}
      GLOWLOOM_AGENT_BUSINESS_TOKEN: ${GLOWLOOM_AGENT_BUSINESS_TOKEN:?Set a separate Agent-to-Go token of at least 32 bytes}
      GLOWLOOM_AGENT_POOL_MAX: "12"
      GLOWLOOM_AGENT_LEASE_MS: "30000"
    expose: ["4401"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4401/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
    mem_limit: 1g
    cpus: 1
  canvas-collaboration:
    build:
      context: ./canvas-collab
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      GLOWLOOM_COLLAB_RUNTIME_TOKEN: ${GLOWLOOM_COLLAB_RUNTIME_TOKEN:?Set an internal collaboration token of at least 32 bytes}
    expose: ["4400"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4400/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
    mem_limit: 512m
    cpus: 1
  frontend:
    container_name: glowloom-frontend
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        GLOWLOOM_BACKEND_ORIGIN: &backend-origin http://backend:18080
    image: glowloom/frontend:latest
    depends_on:
      backend:
        condition: service_healthy
    init: true
    restart: unless-stopped
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      GLOWLOOM_BACKEND_ORIGIN: *backend-origin
      GLOWLOOM_PUBLIC_ORIGIN: "http://localhost:1122"
      NODE_OPTIONS: "--max-old-space-size=2048"
    ports:
      - "127.0.0.1:1122:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s

  backend:
    depends_on:
      canvas-collaboration:
        condition: service_healthy
    container_name: glowloom-backend
    build:
      context: ./backend
      target: dev
    image: glowloom/backend:latest
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/src:ro
      - backend-go-build:/go/build-cache
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8080/healthz && curl -fsS http://127.0.0.1:8081/healthz && curl -fsS http://127.0.0.1:8082/healthz",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 180s
    command: ["--role=all"]
    tmpfs:
      - /work:rw,noexec,nosuid,size=8g
    environment:
      GLOWLOOM_CANVAS_RUNTIME_URL: http://canvas-collaboration:4400
      GLOWLOOM_AGENT_ORIGIN: http://agent:4401
      GLOWLOOM_AGENT_SERVICE_TOKEN: ${GLOWLOOM_AGENT_SERVICE_TOKEN:?Set a separate Go-to-Agent token}
      GLOWLOOM_AGENT_BUSINESS_TOKEN: ${GLOWLOOM_AGENT_BUSINESS_TOKEN:?Set a separate Agent-to-Go token}
      GLOWLOOM_COLLAB_RUNTIME_TOKEN: ${GLOWLOOM_COLLAB_RUNTIME_TOKEN:?Set an internal collaboration token of at least 32 bytes}
      GLOWLOOM_HOST_SERVICE_PORTS: ${GLOWLOOM_HOST_SERVICE_PORTS:-5432 6379 9000 9092}
      GLOWLOOM_ENV: ${GLOWLOOM_ENV:-local}
      GLOWLOOM_LOG_LEVEL: ${GLOWLOOM_LOG_LEVEL:-info}
      GLOWLOOM_DEV_API_PROXY: "true"
      GLOWLOOM_CREDENTIAL_KEY_ID: ${GLOWLOOM_CREDENTIAL_KEY_ID:-}
      GLOWLOOM_CREDENTIAL_PUBLIC_KEY_PEM: ${GLOWLOOM_CREDENTIAL_PUBLIC_KEY_PEM:-}
      GLOWLOOM_CREDENTIAL_PRIVATE_KEY_PEM: ${GLOWLOOM_CREDENTIAL_PRIVATE_KEY_PEM:-}
      GLOWLOOM_CREDENTIAL_PUBLIC_KEY_FILE: ${GLOWLOOM_CREDENTIAL_PUBLIC_KEY_FILE:-}
      GLOWLOOM_CREDENTIAL_PRIVATE_KEY_FILE: ${GLOWLOOM_CREDENTIAL_PRIVATE_KEY_FILE:-}
      GLOWLOOM_CREDENTIAL_REQUEST_MAC_KEY: ${GLOWLOOM_CREDENTIAL_REQUEST_MAC_KEY:-}
      GLOWLOOM_WORKER_HEALTH_ADDR: ":8081"
      GLOWLOOM_RELAY_HEALTH_ADDR: ":8082"
      GLOWLOOM_KAFKA_BROKERS: ${GLOWLOOM_KAFKA_BROKERS:?Set GLOWLOOM_KAFKA_BROKERS for the backend relay}
      GLOWLOOM_WHISPER_ENDPOINT: ${GLOWLOOM_WHISPER_ENDPOINT:-}
      GLOWLOOM_MEDIA_RESULT_ALLOWED_ORIGINS: ${GLOWLOOM_MEDIA_RESULT_ALLOWED_ORIGINS:-}
      GLOWLOOM_MEDIA_ALLOW_TEST_LOOPBACK_TLS: ${GLOWLOOM_MEDIA_ALLOW_TEST_LOOPBACK_TLS:-false}
      GLOWLOOM_HTTP_ADDR: "127.0.0.1:8080"
      GLOWLOOM_PUBLIC_ORIGIN: "http://localhost:1122"
      GLOWLOOM_IDENTITY_SESSION_V2_ENABLED: ${GLOWLOOM_IDENTITY_SESSION_V2_ENABLED:-false}
      GLOWLOOM_IDENTITY_LEGACY_UPGRADE_UNTIL: ${GLOWLOOM_IDENTITY_LEGACY_UPGRADE_UNTIL:-}
      GLOWLOOM_IDENTITY_KEY: ${GLOWLOOM_IDENTITY_KEY:?Set GLOWLOOM_IDENTITY_KEY JSON in .env}
      GLOWLOOM_IDENTITY_JWT_PRIVATE_KEY: ${GLOWLOOM_IDENTITY_JWT_PRIVATE_KEY:-}
      GLOWLOOM_IDENTITY_JWT_VERIFY_KEYS: ${GLOWLOOM_IDENTITY_JWT_VERIFY_KEYS:-}
      GLOWLOOM_IDENTITY_REFRESH_RECEIPT_KEY: ${GLOWLOOM_IDENTITY_REFRESH_RECEIPT_KEY:-}
      GLOWLOOM_IDENTITY_JWT_ACTIVE_KID: ${GLOWLOOM_IDENTITY_JWT_ACTIVE_KID:-}
      GLOWLOOM_IDENTITY_TERMS_VERSION: ${GLOWLOOM_IDENTITY_TERMS_VERSION:-}
      GLOWLOOM_IDENTITY_MAIL_SOURCE_HOURLY_LIMIT: ${GLOWLOOM_IDENTITY_MAIL_SOURCE_HOURLY_LIMIT:-0}
      GLOWLOOM_IDENTITY_MAIL_GLOBAL_HOURLY_LIMIT: ${GLOWLOOM_IDENTITY_MAIL_GLOBAL_HOURLY_LIMIT:-0}
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:-tls}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Glowloom}
      GLOWLOOM_DB_DSN: ${GLOWLOOM_DB_DSN:?Set GLOWLOOM_DB_DSN for the backend API}
      GLOWLOOM_REDIS_URL: ${GLOWLOOM_REDIS_URL:?Set GLOWLOOM_REDIS_URL for the backend API}
      GLOWLOOM_SESSION_IDLE_TTL: ${GLOWLOOM_SESSION_IDLE_TTL:-12h}
      GLOWLOOM_SESSION_ABSOLUTE_TTL: ${GLOWLOOM_SESSION_ABSOLUTE_TTL:-168h}
      GLOWLOOM_OBJECT_STORAGE_CONFIG: ${GLOWLOOM_OBJECT_STORAGE_CONFIG:-}
      GLOWLOOM_STORAGE_ACCESS_KEY: ${GLOWLOOM_STORAGE_ACCESS_KEY:-}
      GLOWLOOM_STORAGE_SECRET_KEY: ${GLOWLOOM_STORAGE_SECRET_KEY:-}
      GLOWLOOM_STORAGE_SESSION_TOKEN: ${GLOWLOOM_STORAGE_SESSION_TOKEN:-}
      GLOWLOOM_STORAGE_MAINTENANCE_DSN: ${GLOWLOOM_STORAGE_MAINTENANCE_DSN:-}
      GLOWLOOM_OTEL_ENDPOINT: ${GLOWLOOM_OTEL_ENDPOINT:-}
    ports:
      - "127.0.0.1:1123:18080"

volumes:
  backend-go-build:
