# Enable only after the Yjs schema migration has passed isolated acceptance.
# docker compose -f docker-compose.yml -f docker-compose.collaboration.yml up -d --build
services:
  canvas-collaboration:
    build:
      context: ./canvas-collab
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      GLOWLOOM_COLLAB_RUNTIME_TOKEN: ${GLOWLOOM_COLLAB_RUNTIME_TOKEN:?Set an internal collaboration token of at least 32 bytes}
    expose: ["4400"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4400/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
    mem_limit: 512m
    cpus: 1
  backend:
    depends_on:
      canvas-collaboration:
        condition: service_healthy
    environment:
      GLOWLOOM_CANVAS_RUNTIME_URL: http://canvas-collaboration:4400
      GLOWLOOM_COLLAB_RUNTIME_TOKEN: ${GLOWLOOM_COLLAB_RUNTIME_TOKEN:?Set an internal collaboration token of at least 32 bytes}
  frontend:
    build:
      args:
        NEXT_PUBLIC_CANVAS_YJS: "true"
    environment:
      NEXT_PUBLIC_CANVAS_YJS: "true"
