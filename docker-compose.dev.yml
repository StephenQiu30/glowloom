# Explicit overlay for the local edit-and-preview loop.
services:
  frontend:
    image: glowloom/frontend:dev
    build:
      target: dev
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
          initial_sync: true
        - action: sync
          path: ./frontend/public
          target: /app/public
          initial_sync: true
        - action: rebuild
          path: ./frontend
          ignore:
            - src/
            - public/
            - tests/
            - node_modules/
            - .next/
            - coverage/
            - "*.tsbuildinfo"
            - .env*
        - action: rebuild
          path: ./canvas/src
        - action: rebuild
          path: ./canvas/types
        - action: rebuild
          path: ./canvas/package.json
        - action: rebuild
          path: ./canvas/pnpm-lock.yaml
        - action: rebuild
          path: ./canvas/tsconfig.json
        - action: rebuild
          path: ./backend/internal/prompt/domain/cinema_catalog.json

  gateway:
    image: glowloom/gateway:dev
    develop:
      watch:
        - action: rebuild
          path: ./backend/cmd/gateway
        - action: rebuild
          path: ./backend/internal/gateway
        - action: rebuild
          path: ./backend/internal/app/gateway
        - action: rebuild
          path: ./backend/internal/platform/httpapi
        - action: rebuild
          path: ./backend/internal/platform/log
        - action: rebuild
          path: ./backend/go.mod
        - action: rebuild
          path: ./backend/go.sum
        - action: rebuild
          path: ./backend/gateway.Dockerfile

  creation:
    image: glowloom/creation:dev
    develop:
      watch:
        - action: rebuild
          path: ./backend/cmd/creation
        - action: rebuild
          path: ./backend/internal/app/creationruntime
        - action: rebuild
          path: ./backend/internal/creation/document
        - action: rebuild
          path: ./backend/internal/script/domain
        - action: rebuild
          path: ./backend/internal/platform/serviceauth
        - action: rebuild
          path: ./backend/internal/contract/gen/creation
        - action: rebuild
          path: ./backend/api/proto/glowloom/creation
        - action: rebuild
          path: ./backend/go.mod
        - action: rebuild
          path: ./backend/go.sum
        - action: rebuild
          path: ./backend/creation.Dockerfile

  media:
    image: glowloom/media:dev
    develop:
      watch:
        - action: rebuild
          path: ./backend/cmd/media
        - action: rebuild
          path: ./backend/internal/app/mediaruntime
        - action: rebuild
          path: ./backend/internal/media/processing
        - action: rebuild
          path: ./backend/internal/platform/serviceauth
        - action: rebuild
          path: ./backend/internal/contract/gen/media
        - action: rebuild
          path: ./backend/api/proto/glowloom/media
        - action: rebuild
          path: ./backend/go.mod
        - action: rebuild
          path: ./backend/go.sum
        - action: rebuild
          path: ./backend/media.Dockerfile

  backend:
    image: glowloom/backend:dev
    develop: &backend-development
      watch:
        - action: rebuild
          path: ./backend
          ignore:
            - db/
            - tests/

  worker:
    image: glowloom/backend:dev
    develop: *backend-development

  relay:
    image: glowloom/backend:dev
    develop: *backend-development

  agent:
    image: glowloom/agent:dev
    develop:
      watch:
        - action: rebuild
          path: ./agent
          ignore:
            - node_modules/
            - dist/
            - coverage/
            - tests/
            - .env*

  canvas:
    image: glowloom/canvas:dev
    develop:
      watch:
        - action: rebuild
          path: ./canvas
          ignore:
            - node_modules/
            - dist/
            - coverage/
            - tests/
            - .env*
