# Production application configuration; deployment acceptance remains in OPS-01.
# Run independently; dependency services live in docker-compose-env.yml.
name: glowloom-prod

services:
  backend-api:
    build: ./backend
    image: glowloom/backend:local
    command: ["--role=api"]
    environment:
      GLOWLOOM_ENV: ${GLOWLOOM_ENV-${LV_ENV:-local}}
      GLOWLOOM_LOG_LEVEL: ${GLOWLOOM_LOG_LEVEL-${LV_LOG_LEVEL:-info}}
      GLOWLOOM_HTTP_ADDR: ":8080"
      GLOWLOOM_IDENTITY_KEY: ${GLOWLOOM_IDENTITY_KEY-${LV_IDENTITY_KEY:?Set GLOWLOOM_IDENTITY_KEY JSON in .env}}
      GLOWLOOM_IDENTITY_SESSION_V2_ENABLED: ${GLOWLOOM_IDENTITY_SESSION_V2_ENABLED-${LV_IDENTITY_SESSION_V2_ENABLED:-false}}
      GLOWLOOM_IDENTITY_LEGACY_UPGRADE_UNTIL: ${GLOWLOOM_IDENTITY_LEGACY_UPGRADE_UNTIL-${LV_IDENTITY_LEGACY_UPGRADE_UNTIL:-}}
      GLOWLOOM_IDENTITY_JWT_PRIVATE_KEY: ${GLOWLOOM_IDENTITY_JWT_PRIVATE_KEY-${LV_IDENTITY_JWT_PRIVATE_KEY:-}}
      GLOWLOOM_IDENTITY_JWT_VERIFY_KEYS: ${GLOWLOOM_IDENTITY_JWT_VERIFY_KEYS-${LV_IDENTITY_JWT_VERIFY_KEYS:-}}
      GLOWLOOM_IDENTITY_JWT_ACTIVE_KID: ${GLOWLOOM_IDENTITY_JWT_ACTIVE_KID-${LV_IDENTITY_JWT_ACTIVE_KID:-}}
      GLOWLOOM_IDENTITY_REFRESH_RECEIPT_KEY: ${GLOWLOOM_IDENTITY_REFRESH_RECEIPT_KEY-${LV_IDENTITY_REFRESH_RECEIPT_KEY:-}}
      GLOWLOOM_PUBLIC_ORIGIN: ${GLOWLOOM_PUBLIC_ORIGIN-${LV_PUBLIC_ORIGIN:?Set GLOWLOOM_PUBLIC_ORIGIN to the browser origin}}
      GLOWLOOM_DB_DSN: ${GLOWLOOM_DB_DSN-${LV_DB_DSN:?Set GLOWLOOM_DB_DSN for the backend API}}
      GLOWLOOM_REDIS_URL: ${GLOWLOOM_REDIS_URL-${LV_REDIS_URL:?Set GLOWLOOM_REDIS_URL for the backend API}}
      GLOWLOOM_SESSION_IDLE_TTL: ${GLOWLOOM_SESSION_IDLE_TTL-${LV_SESSION_IDLE_TTL:-12h}}
      GLOWLOOM_SESSION_ABSOLUTE_TTL: ${GLOWLOOM_SESSION_ABSOLUTE_TTL-${LV_SESSION_ABSOLUTE_TTL:-168h}}
      GLOWLOOM_TEMPORAL_ADDR: ${GLOWLOOM_TEMPORAL_ADDR-${LV_TEMPORAL_ADDR:?Set GLOWLOOM_TEMPORAL_ADDR for the backend API}}
      GLOWLOOM_TEMPORAL_NAMESPACE: ${GLOWLOOM_TEMPORAL_NAMESPACE-${LV_TEMPORAL_NAMESPACE:?Set GLOWLOOM_TEMPORAL_NAMESPACE for the backend API}}
      GLOWLOOM_OBJECT_STORAGE_ENDPOINT: ${GLOWLOOM_OBJECT_STORAGE_ENDPOINT-${LV_OBJECT_STORAGE_ENDPOINT:?Set GLOWLOOM_OBJECT_STORAGE_ENDPOINT for the backend API}}
      GLOWLOOM_OBJECT_STORAGE_BUCKET: ${GLOWLOOM_OBJECT_STORAGE_BUCKET-${LV_OBJECT_STORAGE_BUCKET:?Set GLOWLOOM_OBJECT_STORAGE_BUCKET for the backend API}}
      GLOWLOOM_OBJECT_STORAGE_ACCESS_KEY: ${GLOWLOOM_OBJECT_STORAGE_ACCESS_KEY-${LV_OBJECT_STORAGE_ACCESS_KEY:?Set GLOWLOOM_OBJECT_STORAGE_ACCESS_KEY for the backend API}}
      GLOWLOOM_OBJECT_STORAGE_SECRET_KEY: ${GLOWLOOM_OBJECT_STORAGE_SECRET_KEY-${LV_OBJECT_STORAGE_SECRET_KEY:?Set GLOWLOOM_OBJECT_STORAGE_SECRET_KEY for the backend API}}
      GLOWLOOM_OBJECT_STORAGE_REGION: ${GLOWLOOM_OBJECT_STORAGE_REGION-${LV_OBJECT_STORAGE_REGION:-}}
      GLOWLOOM_OTEL_ENDPOINT: ${GLOWLOOM_OTEL_ENDPOINT-${LV_OTEL_ENDPOINT:-}}
    ports:
      - "${GLOWLOOM_BACKEND_PORT-${LV_BACKEND_PORT:-8080}}:8080"

  backend-worker:
    build: ./backend
    image: glowloom/backend:local
    command: ["--role=worker", "--queues=flow"]
    environment:
      GLOWLOOM_ENV: ${GLOWLOOM_ENV-${LV_ENV:-local}}
      GLOWLOOM_LOG_LEVEL: ${GLOWLOOM_LOG_LEVEL-${LV_LOG_LEVEL:-info}}
      GLOWLOOM_WORKER_HEALTH_ADDR: ":8081"
      GLOWLOOM_DB_DSN: ${GLOWLOOM_DB_DSN-${LV_DB_DSN:?Set GLOWLOOM_DB_DSN for the backend worker}}
      GLOWLOOM_TEMPORAL_ADDR: ${GLOWLOOM_TEMPORAL_ADDR-${LV_TEMPORAL_ADDR:?Set GLOWLOOM_TEMPORAL_ADDR for the backend worker}}
      GLOWLOOM_TEMPORAL_NAMESPACE: ${GLOWLOOM_TEMPORAL_NAMESPACE-${LV_TEMPORAL_NAMESPACE:?Set GLOWLOOM_TEMPORAL_NAMESPACE for the backend worker}}
      GLOWLOOM_OTEL_ENDPOINT: ${GLOWLOOM_OTEL_ENDPOINT-${LV_OTEL_ENDPOINT:-}}
    ports:
      - "${GLOWLOOM_WORKER_HEALTH_PORT-${LV_WORKER_HEALTH_PORT:-8081}}:8081"

  backend-temporal-setup:
    build: ./backend
    image: glowloom/backend:local
    command: ["temporal", "setup"]
    profiles: ["maintenance-setup"]
    environment:
      GLOWLOOM_ENV: ${GLOWLOOM_ENV-${LV_ENV:-local}}
      GLOWLOOM_LOG_LEVEL: ${GLOWLOOM_LOG_LEVEL-${LV_LOG_LEVEL:-info}}
      GLOWLOOM_TEMPORAL_ADDR: ${GLOWLOOM_TEMPORAL_ADDR-${LV_TEMPORAL_ADDR:?Set GLOWLOOM_TEMPORAL_ADDR for Temporal setup}}
      GLOWLOOM_TEMPORAL_NAMESPACE: ${GLOWLOOM_TEMPORAL_NAMESPACE-${LV_TEMPORAL_NAMESPACE:?Set GLOWLOOM_TEMPORAL_NAMESPACE for Temporal setup}}
      GLOWLOOM_OTEL_ENDPOINT: ${GLOWLOOM_OTEL_ENDPOINT-${LV_OTEL_ENDPOINT:-}}
    restart: "no"

  backend-worker-media:
    build: ./backend
    image: glowloom/backend:local
    command: ["--role=worker", "--queues=media"]
    read_only: true
    tmpfs:
      - /work:rw,noexec,nosuid,size=8g
    environment:
      GLOWLOOM_ENV: ${GLOWLOOM_ENV-${LV_ENV:-local}}
      GLOWLOOM_LOG_LEVEL: ${GLOWLOOM_LOG_LEVEL-${LV_LOG_LEVEL:-info}}
      GLOWLOOM_WORKER_HEALTH_ADDR: ":8081"
      GLOWLOOM_DB_DSN: ${GLOWLOOM_DB_DSN-${LV_DB_DSN:?Set GLOWLOOM_DB_DSN for the media worker}}
      GLOWLOOM_TEMPORAL_ADDR: ${GLOWLOOM_TEMPORAL_ADDR-${LV_TEMPORAL_ADDR:?Set GLOWLOOM_TEMPORAL_ADDR for the media worker}}
      GLOWLOOM_TEMPORAL_NAMESPACE: ${GLOWLOOM_TEMPORAL_NAMESPACE-${LV_TEMPORAL_NAMESPACE:?Set GLOWLOOM_TEMPORAL_NAMESPACE for the media worker}}
      GLOWLOOM_OBJECT_STORAGE_ENDPOINT: ${GLOWLOOM_OBJECT_STORAGE_ENDPOINT-${LV_OBJECT_STORAGE_ENDPOINT:?Set GLOWLOOM_OBJECT_STORAGE_ENDPOINT for the media worker}}
      GLOWLOOM_OBJECT_STORAGE_BUCKET: ${GLOWLOOM_OBJECT_STORAGE_BUCKET-${LV_OBJECT_STORAGE_BUCKET:?Set GLOWLOOM_OBJECT_STORAGE_BUCKET for the media worker}}
      GLOWLOOM_OBJECT_STORAGE_ACCESS_KEY: ${GLOWLOOM_OBJECT_STORAGE_ACCESS_KEY-${LV_OBJECT_STORAGE_ACCESS_KEY:?Set GLOWLOOM_OBJECT_STORAGE_ACCESS_KEY for the media worker}}
      GLOWLOOM_OBJECT_STORAGE_SECRET_KEY: ${GLOWLOOM_OBJECT_STORAGE_SECRET_KEY-${LV_OBJECT_STORAGE_SECRET_KEY:?Set GLOWLOOM_OBJECT_STORAGE_SECRET_KEY for the media worker}}
      GLOWLOOM_OBJECT_STORAGE_REGION: ${GLOWLOOM_OBJECT_STORAGE_REGION-${LV_OBJECT_STORAGE_REGION:-}}
      GLOWLOOM_MEDIA_RESULT_ALLOWED_ORIGINS: ${GLOWLOOM_MEDIA_RESULT_ALLOWED_ORIGINS-${LV_MEDIA_RESULT_ALLOWED_ORIGINS:-}}
      GLOWLOOM_MEDIA_ALLOW_TEST_LOOPBACK_TLS: ${GLOWLOOM_MEDIA_ALLOW_TEST_LOOPBACK_TLS-${LV_MEDIA_ALLOW_TEST_LOOPBACK_TLS:-false}}
      GLOWLOOM_OTEL_ENDPOINT: ${GLOWLOOM_OTEL_ENDPOINT-${LV_OTEL_ENDPOINT:-}}
    ports:
      - "${GLOWLOOM_MEDIA_WORKER_HEALTH_PORT-${LV_MEDIA_WORKER_HEALTH_PORT:-8083}}:8081"

  backend-relay:
    build: ./backend
    image: glowloom/backend:local
    command: ["--role=relay"]
    environment:
      GLOWLOOM_ENV: ${GLOWLOOM_ENV-${LV_ENV:-local}}
      GLOWLOOM_LOG_LEVEL: ${GLOWLOOM_LOG_LEVEL-${LV_LOG_LEVEL:-info}}
      GLOWLOOM_RELAY_HEALTH_ADDR: ":8082"
      GLOWLOOM_DB_DSN: ${GLOWLOOM_DB_DSN-${LV_DB_DSN:?Set GLOWLOOM_DB_DSN for the backend relay}}
      GLOWLOOM_REDIS_URL: ${GLOWLOOM_REDIS_URL-${LV_REDIS_URL:?Set GLOWLOOM_REDIS_URL for the backend relay}}
      GLOWLOOM_KAFKA_BROKERS: ${GLOWLOOM_KAFKA_BROKERS-${LV_KAFKA_BROKERS:?Set GLOWLOOM_KAFKA_BROKERS for the backend relay}}
      GLOWLOOM_TEMPORAL_ADDR: ${GLOWLOOM_TEMPORAL_ADDR-${LV_TEMPORAL_ADDR:?Set GLOWLOOM_TEMPORAL_ADDR for the workflow starter}}
      GLOWLOOM_TEMPORAL_NAMESPACE: ${GLOWLOOM_TEMPORAL_NAMESPACE-${LV_TEMPORAL_NAMESPACE:?Set GLOWLOOM_TEMPORAL_NAMESPACE for the workflow starter}}
      GLOWLOOM_OTEL_ENDPOINT: ${GLOWLOOM_OTEL_ENDPOINT-${LV_OTEL_ENDPOINT:-}}
    ports:
      - "${GLOWLOOM_RELAY_HEALTH_PORT-${LV_RELAY_HEALTH_PORT:-8082}}:8082"
