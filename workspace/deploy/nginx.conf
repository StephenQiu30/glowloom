server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  location / { try_files $uri $uri/ =404; }
  error_page 404 /404.html;
  location ~ /\. { deny all; }
}
