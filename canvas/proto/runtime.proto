syntax = "proto3";

package glowloom.canvas;

option go_package = "github.com/StephenQiu30/glowloom-server/backend/internal/gen/canvas;canvaspb";

// CanvasRuntime provides stateless Yjs candidate computation over gRPC.
service CanvasRuntime {
  rpc Initialize(ComputeRequest) returns (ComputeResponse);
  rpc Prepare(ComputeRequest) returns (ComputeResponse);
  rpc Rename(ComputeRequest) returns (ComputeResponse);
  rpc Commands(ComputeRequest) returns (ComputeResponse);
  rpc CheckHealth(HealthRequest) returns (HealthResponse);
}

message ComputeRequest {
  bytes payload_json = 1;
  bytes update_bytes = 2;
}

message ComputeResponse {
  bytes payload_json = 1;
  string error_code = 2;
  bool definitive = 3;
}

message HealthRequest {}

message HealthResponse {
  string status = 1;
}
