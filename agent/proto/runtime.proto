syntax = "proto3";

package glowloom.agent;

option go_package = "github.com/StephenQiu30/glowloom-server/backend/internal/gen/agent;agentpb";

// AgentRuntime exposes the independent Pi Durable Agent runtime to the Go monolith over gRPC.
service AgentRuntime {
  rpc Invoke(InvokeRequest) returns (InvokeResponse);
  rpc StreamRunEvents(StreamRunEventsRequest) returns (stream RunEventFrame);
  rpc CheckHealth(HealthRequest) returns (HealthResponse);
}

// AgentBusiness exposes Go monolith business authority callbacks to the Agent runtime over gRPC.
service AgentBusiness {
  rpc Invoke(InvokeRequest) returns (InvokeResponse);
  rpc CheckHealth(HealthRequest) returns (HealthResponse);
}

message InvokeRequest {
  string operation = 1;
  string method = 2;
  string path = 3;
  map<string, string> params = 4;
  map<string, string> query = 5;
  map<string, string> headers = 6;
  bytes body_json = 7;
}

message InvokeResponse {
  int32 status_code = 1;
  string content_type = 2;
  bytes body_json = 3;
}

message StreamRunEventsRequest {
  string run_id = 1;
  string last_event_id = 2;
  map<string, string> query = 3;
}

message RunEventFrame {
  string id = 1;
  string event = 2;
  bytes data_json = 3;
}

message HealthRequest {}

message HealthResponse {
  string status = 1;
}
