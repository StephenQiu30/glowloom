# Complete dependency environment definition for containerized deployment.
# Local development uses host-managed services and does not start this file.
# Supply GLOWLOOM_PG_PASSWORD and GLOWLOOM_MINIO_PASSWORD through deployment configuration.
name: glowloom-env

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: ${GLOWLOOM_PG_USER-${LV_PG_USER:-glowloom}}
      POSTGRES_PASSWORD: ${GLOWLOOM_PG_PASSWORD-${LV_PG_PASSWORD:?Set GLOWLOOM_PG_PASSWORD for Compose}}
      POSTGRES_DB: ${GLOWLOOM_PG_DATABASE-${LV_PG_DATABASE:-glowloom}}
    ports:
      - "${GLOWLOOM_PG_PORT-${LV_PG_PORT:-5432}}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.10.0-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${GLOWLOOM_REDIS_PORT-${LV_REDIS_PORT:-6379}}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.1.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${GLOWLOOM_KAFKA_PORT-${LV_KAFKA_PORT:-9092}}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "${GLOWLOOM_KAFKA_PORT-${LV_KAFKA_PORT:-9092}}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${GLOWLOOM_MINIO_USER-${LV_MINIO_USER:-glowloom}}
      MINIO_ROOT_PASSWORD: ${GLOWLOOM_MINIO_PASSWORD-${LV_MINIO_PASSWORD:?Set GLOWLOOM_MINIO_PASSWORD for Compose}}
    ports:
      - "${GLOWLOOM_MINIO_PORT-${LV_MINIO_PORT:-9000}}:9000"
      - "${GLOWLOOM_MINIO_CONSOLE_PORT-${LV_MINIO_CONSOLE_PORT:-9001}}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Temporal uses separate temporal and temporal_visibility databases in PostgreSQL.
  temporal:
    image: temporalio/auto-setup:1.29.7
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${GLOWLOOM_PG_USER-${LV_PG_USER:-glowloom}}
      POSTGRES_PWD: ${GLOWLOOM_PG_PASSWORD-${LV_PG_PASSWORD:?Set GLOWLOOM_PG_PASSWORD for Compose}}
      POSTGRES_SEEDS: postgres
      DEFAULT_NAMESPACE: ${GLOWLOOM_TEMPORAL_NAMESPACE-${LV_TEMPORAL_NAMESPACE:-glowloom-local}}
    ports:
      - "${GLOWLOOM_TEMPORAL_PORT-${LV_TEMPORAL_PORT:-7233}}:7233"
    healthcheck:
      test: ["CMD-SHELL", "tctl --address temporal:7233 cluster health | grep -q SERVING"]
      interval: 10s
      timeout: 5s
      retries: 30

  temporal-ui:
    image: temporalio/ui:2.54.1
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "${GLOWLOOM_TEMPORAL_UI_PORT-${LV_TEMPORAL_UI_PORT:-8233}}:8080"

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: glowloom-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - "${GLOWLOOM_KAFKA_UI_PORT-${LV_KAFKA_UI_PORT:-8088}}:8080"

volumes:
  postgres-data:
    name: glowloom_postgres-data
  redis-data:
    name: glowloom_redis-data
  kafka-data:
    name: glowloom_kafka-data
  minio-data:
    name: glowloom_minio-data
