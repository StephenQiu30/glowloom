<!doctype html><meta charset="utf-8"><title>流光独立像素核对</title><style>body{background:#0c0c0c;color:#ddd;font:16px system-ui;margin:30px}section{display:flex;gap:32px}.v{overflow:hidden;width:200px;height:55px;position:relative;background-size:200px 55px}img,canvas{width:200px;height:55px}canvas{position:absolute;width:1512px;height:772px;left:-1090px;top:-235px}button{margin-top:24px;padding:12px}pre{font-size:14px}.v{position:fixed;left:1090px;top:235px}</style><h1>流光独立像素核对</h1><p>即梦暂时隐藏基线采样后已恢复；同 DPR、路径和缩放，仅拟合相位，颜色/亮度参数保持源码实测值。</p><section><div><h2>即梦原始流光</h2><img src="isolated-reference.png"></div><div><h2>当前产品渲染器</h2><div class="v" style="background-image:url(isolated-background.png)"><canvas></canvas></div></div></section><button id="compare">开始同相位比较</button><pre id="result">待测量</pre><script type="module">
import{createConnectionFlowSurface}from'./connection-flow-surface.js';import{connectionFlowMesh}from'./connection-flow-model.js';const geo=await(await fetch('isolated-geometry.json')).json(),m=geo.matrix,c=document.querySelector('canvas'),surface=createConnectionFlowSurface(c);surface.upload(connectionFlowMesh(geo.path));const view={width:1512,height:772,dpr:2,x:m.e,y:m.f,zoom:m.a};const load=async src=>{let i=new Image();i.src=src;await i.decode();let c=document.createElement('canvas');c.width=400;c.height=110;let ctx=c.getContext('2d');ctx.drawImage(i,0,0);return ctx.getImageData(0,0,400,110).data;};const[ref,bg]=await Promise.all([load('isolated-reference.png'),load('isolated-background.png')]);const mask=[];for(let i=0;i<ref.length;i+=4)if(Math.abs(ref[i]-bg[i])+Math.abs(ref[i+1]-bg[i+1])+Math.abs(ref[i+2]-bg[i+2])>5)mask.push(i);const gl=c.getContext('webgl2'),pixels=new Uint8Array(400*110*4);
function measure(time,details=false){surface.render(view,time);gl.readPixels(2180,964,400,110,gl.RGBA,gl.UNSIGNED_BYTE,pixels);let abs=0,sq=0,max=0,exact=0;for(let i of mask){let x=i/4%400,y=Math.floor(i/4/400),j=((109-y)*400+x)*4,a=pixels[j+3]/255;for(let k=0;k<3;k++){let d=Math.abs(ref[i+k]-Math.round(pixels[j+k]+bg[i+k]*(1-a)));abs+=d;sq+=d*d;max=Math.max(max,d);if(!d)exact++;}}let n=mask.length*3;return details?{phaseMs:time,maskPixels:mask.length,meanAbsoluteRgbError:abs/n,rmsRgbError:Math.sqrt(sq/n),maxChannelError:max,exactChannelFraction:exact/n,periodMs:2600}:sq/n;}
document.querySelector('button').onclick=()=>{let best={s:Infinity,t:0};for(let t=0;t<2600;t+=10){let s=measure(t);if(s<best.s)best={s,t}}let center=best.t;for(let t=center-12;t<center+12;t+=.25){let s=measure(t);if(s<best.s)best={s,t}}document.querySelector('#result').textContent=JSON.stringify(measure(best.t,true),null,2);surface.render(view,best.t)};surface.render(view,1300);
</script>
