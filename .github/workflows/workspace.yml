name: Workspace
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: workspace-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      meilisearch:
        image: getmeili/meilisearch:v1.37
        env:
          MEILI_MASTER_KEY: workspace-ci-only-meilisearch-key
          MEILI_NO_ANALYTICS: "true"
        ports: [7700:7700]
    env:
      NEXT_PUBLIC_MEILISEARCH_HOST: http://127.0.0.1:7700
      MEILISEARCH_ADMIN_KEY: workspace-ci-only-meilisearch-key
    defaults:
      run:
        working-directory: workspace
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: workspace/package.json
          cache: true
          cache_dependency_path: workspace/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Prepare isolated search-only key
        run: |
          curl --fail --silent --retry 20 --retry-connrefused --retry-delay 1 "$NEXT_PUBLIC_MEILISEARCH_HOST/health" > /dev/null
          node --input-type=module <<'JS'
          import {appendFileSync} from 'node:fs';
          import {Meilisearch} from 'meilisearch';
          const client = new Meilisearch({host: process.env.NEXT_PUBLIC_MEILISEARCH_HOST, apiKey: process.env.MEILISEARCH_ADMIN_KEY});
          const key = await client.createKey({description: 'Workspace isolated CI search', actions: ['search'], indexes: ['docs'], expiresAt: null});
          appendFileSync(process.env.GITHUB_ENV, `NEXT_PUBLIC_MEILISEARCH_SEARCH_KEY=${key.key}\n`);
          JS
      - run: pnpm lint
      - run: pnpm types:check
      - run: pnpm format:check
      - run: pnpm build
      - name: Official Fumadocs browser acceptance
        run: |
          pnpm start > "$RUNNER_TEMP/workspace-next.log" 2>&1 &
          reader_pid=$!
          trap 'kill "$reader_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:1130/read > /dev/null
          pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: workspace-browser-evidence
          path: workspace/test-results
