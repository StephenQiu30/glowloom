name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: glowloom_reference
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d glowloom_reference"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GLOWLOOM_TEST_SCHEMA_DB_DSN: postgres://postgres@127.0.0.1:5432/schema_probe?sslmode=disable
      GLOWLOOM_TEST_CANVAS_DB_DSN: postgres://postgres@127.0.0.1:5432/glowloom_reference?sslmode=disable
      GLOWLOOM_TEST_GOVERNANCE_DB_DSN: postgres://postgres@127.0.0.1:5432/glowloom_governance?sslmode=disable
      GLOWLOOM_TEST_CANVAS_HTTP_DB_DSN: postgres://postgres@127.0.0.1:5432/glowloom_reference?sslmode=disable
      GLOWLOOM_TEST_PROJECT_COPY_DB_DSN: postgres://postgres@127.0.0.1:5432/glowloom_reference?sslmode=disable
      GLOWLOOM_TEST_CANVAS_M1_RUNTIME_DSN: postgres://canvas_test_runtime@127.0.0.1:5432/glowloom_reference?sslmode=disable&options=-c%20role%3Dglowloom_app
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: canvas-collab/package.json
          cache: true
          cache_dependency_path: canvas-collab/pnpm-lock.yaml
      - name: Install and test the private collaboration runtime
        working-directory: canvas-collab
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm test
      - name: Install media probe tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Initialize isolated test databases
        run: |
          psql "$GLOWLOOM_TEST_CANVAS_DB_DSN" -X -v ON_ERROR_STOP=1 -c 'CREATE ROLE glowloom_app NOLOGIN NOSUPERUSER' -c 'CREATE ROLE canvas_test_runtime LOGIN INHERIT NOSUPERUSER IN ROLE glowloom_app' -c 'CREATE DATABASE schema_probe' -c 'CREATE DATABASE glowloom_governance'
          psql "$GLOWLOOM_TEST_CANVAS_DB_DSN" -X --single-transaction -v ON_ERROR_STOP=1 -f db/schema.sql
          psql "$GLOWLOOM_TEST_GOVERNANCE_DB_DSN" -X --single-transaction -v ON_ERROR_STOP=1 -f db/schema.sql
      - name: Run backend Race tests
        run: go test -race -count=1 ./...

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
          cache: true
          cache_dependency_path: |
            frontend/pnpm-lock.yaml
            canvas-collab/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run frontend business tests
        run: pnpm exec vitest run --maxWorkers=2
      - name: Build frontend and check TypeScript
        run: pnpm exec next build
