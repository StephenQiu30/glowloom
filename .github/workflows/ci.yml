name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: glowloom_reference
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d glowloom_reference"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GLOWLOOM_TEST_SCHEMA_DB_DSN: postgres://postgres@127.0.0.1:5432/schema_probe?sslmode=disable
      GLOWLOOM_TEST_CANVAS_DB_DSN: postgres://postgres@127.0.0.1:5432/glowloom_reference?sslmode=disable
      GLOWLOOM_TEST_CANVAS_HTTP_DB_DSN: postgres://postgres@127.0.0.1:5432/glowloom_reference?sslmode=disable
      GLOWLOOM_TEST_PROJECT_COPY_DB_DSN: postgres://postgres@127.0.0.1:5432/glowloom_reference?sslmode=disable
      GLOWLOOM_TEST_CANVAS_M1_RUNTIME_DSN: postgres://canvas_test_runtime@127.0.0.1:5432/glowloom_reference?sslmode=disable&options=-c%20role%3Dglowloom_app
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install and test the private collaboration runtime
        working-directory: canvas-collab
        run: |
          npm install --global pnpm@12.4.2
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm test
      - name: Keep backend tests outside production source
        run: |
          test_file="$(find . -type f -name '*_test.go' ! -path './tests/*' -print -quit)"
          if [ -n "$test_file" ]; then
            echo "Go tests must live under backend/tests/: $test_file" >&2
            exit 1
          fi
      - run: go install golang.org/x/tools/cmd/goimports@v0.50.0
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - run: go install github.com/google/wire/cmd/wire@v0.7.0
      - run: golangci-lint run ./...
      - run: govulncheck ./...
      - name: Check generated dependencies
        run: |
          wire ./internal/app
          goimports -local github.com/StephenQiu30/glowloom-server/backend -w internal/app/wire_gen.go
          git diff --exit-code -- internal/app/wire_gen.go
      - name: Install media probe tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Initialize isolated canvas database
        run: |
          psql "$GLOWLOOM_TEST_CANVAS_DB_DSN" -X -v ON_ERROR_STOP=1 -c 'CREATE ROLE glowloom_app NOLOGIN NOSUPERUSER' -c 'CREATE ROLE canvas_test_runtime LOGIN INHERIT NOSUPERUSER IN ROLE glowloom_app' -c 'CREATE DATABASE schema_probe'
          psql "$GLOWLOOM_TEST_CANVAS_DB_DSN" -X --single-transaction -v ON_ERROR_STOP=1 -f db/schema.sql
      - name: Run backend Race tests
        run: go test -race -count=1 -v ./...

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm install --global pnpm@12.4.2
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Keep frontend tests outside production source
        run: |
          test_file="$(find src -type f \( -name '*.test.ts' -o -name '*.test.tsx' -o -name '*.spec.ts' -o -name '*.spec.tsx' \) -print -quit)"
          if [ -n "$test_file" ]; then
            echo "Frontend tests must live under frontend/tests/: $test_file" >&2
            exit 1
          fi
      - run: pnpm exec eslint .
      - run: pnpm exec next typegen
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec vitest run
      - run: pnpm exec next build
