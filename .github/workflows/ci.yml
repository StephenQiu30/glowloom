name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      kafka:
        image: apache/kafka:4.1.0
        env:
          KAFKA_NODE_ID: "1"
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
        ports: ["9092:9092"]
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_DB: glowloom_reference
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d glowloom_reference"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Metadata and worker-recovery tests share this isolated local COS protocol fixture.
      GLOWLOOM_OBJECT_STORAGE_CONFIG: >-
        {"schema_version":1,"revision":"1","default_write_profile":"test-main","profiles":{"test-main":{"provider":"cos","mode":"read_write","endpoint":"http://127.0.0.1:19000","signing_endpoint":"http://127.0.0.1:19000","bucket":"glowloom-test","region":"us-east-1","credentials":{"source":"env","access_key_env":"GLOWLOOM_TEST_STORAGE_AK","secret_key_env":"GLOWLOOM_TEST_STORAGE_SK"}}},"upload":{"mode":"relay","signed_url_ttl":600000000000,"session_ttl":86400000000000,"multipart_threshold_bytes":33554432,"part_size_bytes":8388608,"part_concurrency":3,"staging_retention":172800000000000},"access":{"preview_ttl":300000000000,"max_signed_url_ttl":900000000000},"limits":{"max_image_bytes":20971520,"max_video_bytes":524288000,"max_audio_bytes":104857600,"max_model_bytes":67108864,"max_document_bytes":20971520}}
      GLOWLOOM_TEST_STORAGE_AK: metadata-fixture
      GLOWLOOM_TEST_STORAGE_SK: metadata-fixture-secret
      GLOWLOOM_TEST_APP_SCOPE_DB_DSN: postgres://postgres@127.0.0.1:5432/glowloom_app_scope_test?sslmode=disable
      GLOWLOOM_TEST_AGENT_BUSINESS_DB_DSN: postgres://postgres@127.0.0.1:5432/glowloom_business_test?sslmode=disable
      GLOWLOOM_TEST_AGENT_CANVAS_DB_DSN: postgres://postgres@127.0.0.1:5432/glowloom_agent_canvas_test?sslmode=disable
      GLOWLOOM_TEST_AGENT_SHOT_DB_DSN: postgres://postgres@127.0.0.1:5432/glowloom_agent_shot_ci_test?sslmode=disable
      GLOWLOOM_TEST_SHOT_PIPELINE_DB_DSN: postgres://postgres@127.0.0.1:5432/glowloom_shot_pipeline_ci_test?sslmode=disable
      GLOWLOOM_TEST_AGENT_BOUNDARY_DB_DSN: postgres://postgres@127.0.0.1:5432/glowloom_boundary_test?sslmode=disable
      GLOWLOOM_TEST_TASK_DB_DSN: postgres://postgres@127.0.0.1:5432/glowloom_tasks_test?sslmode=disable
      GLOWLOOM_TEST_MAINTENANCE_DB_DSN: postgres://postgres@127.0.0.1:5432/glowloom_maintenance_test?sslmode=disable
      GLOWLOOM_TEST_OPERATION_STORE_DB_DSN: postgres://postgres@127.0.0.1:5432/glowloom_receipt?sslmode=disable
      GLOWLOOM_TEST_NOTIFICATION_DB_DSN: postgres://postgres@127.0.0.1:5432/notifications_ci_test?sslmode=disable
      GLOWLOOM_TEST_NOTIFICATION_KAFKA_BROKERS: 127.0.0.1:9092
      GLOWLOOM_TEST_AI_REBUILD_DSN: postgres://postgres@127.0.0.1:5432/glowloom_ai_rebuild_test?sslmode=disable
      GLOWLOOM_TEST_MODEL_GATEWAY_DB_DSN: postgres://postgres@127.0.0.1:5432/glowloom_gateway_test?sslmode=disable
      GLOWLOOM_AGENT_TEST_DB_DSN: postgres://glowloom_agent@127.0.0.1:5432/glowloom_boundary_test?sslmode=disable
      GLOWLOOM_TEST_AGENT_ENTRYPOINT: ${{ github.workspace }}/agent/dist/src/server.js
      GLOWLOOM_TEST_SCHEMA_DB_DSN: postgres://postgres@127.0.0.1:5432/schema_probe?sslmode=disable
      GLOWLOOM_TEST_DB_DSN: postgres://postgres@127.0.0.1:5432/glowloom_owner_ci_test?sslmode=disable
      GLOWLOOM_TEST_WRITE_FENCE_DB_DSN: postgres://postgres@127.0.0.1:5432/glowloom_owner_ci_test?sslmode=disable
      GLOWLOOM_TEST_CANVAS_DB_DSN: postgres://postgres@127.0.0.1:5432/glowloom_reference?sslmode=disable
      GLOWLOOM_TEST_GOVERNANCE_DB_DSN: postgres://postgres@127.0.0.1:5432/glowloom_governance?sslmode=disable
      GLOWLOOM_TEST_CATALOG_DB_DSN: postgres://postgres@127.0.0.1:5432/glowloom_catalog?sslmode=disable
      GLOWLOOM_TEST_MODEL_CATALOG_DB_DSN: postgres://postgres@127.0.0.1:5432/glowloom_catalog?sslmode=disable
      GLOWLOOM_TEST_STORAGE_SCHEMA_DSN: postgres://postgres@127.0.0.1:5432/glowloom_subject_storage_ci?sslmode=disable
      GLOWLOOM_TEST_PACKAGE_LOCATION_DSN: postgres://postgres@127.0.0.1:5432/glowloom_subject_storage_package_ci?sslmode=disable
      GLOWLOOM_TEST_SCRIPT_LOCATION_DSN: postgres://postgres@127.0.0.1:5432/glowloom_subject_storage_script_ci?sslmode=disable
      GLOWLOOM_TEST_SUBJECT_SOURCE_DB_DSN: postgres://postgres@127.0.0.1:5432/glowloom_subject_source_ci?sslmode=disable
      GLOWLOOM_TEST_SUBJECT_DB_DSN: postgres://postgres@127.0.0.1:5432/glowloom_subject_alignment_ci?sslmode=disable
      GLOWLOOM_TEST_CANVAS_HTTP_DB_DSN: postgres://postgres@127.0.0.1:5432/glowloom_reference?sslmode=disable
      GLOWLOOM_TEST_PROJECT_COPY_DB_DSN: postgres://postgres@127.0.0.1:5432/glowloom_reference?sslmode=disable
      GLOWLOOM_TEST_CANVAS_M1_RUNTIME_DSN: postgres://canvas_test_runtime@127.0.0.1:5432/glowloom_reference?sslmode=disable&options=-c%20role%3Dglowloom_app
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: canvas/package.json
          cache: true
          cache_dependency_path: canvas/pnpm-lock.yaml
      - name: Check full Go quality
        run: |
          GOBIN="$RUNNER_TEMP/go-tools" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          "$RUNNER_TEMP/go-tools/golangci-lint" run ./...
          go vet ./...
          go build ./...
      - name: Install and test Canvas
        working-directory: canvas
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm test
      - name: Install media probe tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Initialize isolated test databases
        run: |
          admin_dsn="$GLOWLOOM_TEST_CANVAS_DB_DSN"
          psql "$admin_dsn" -X -v ON_ERROR_STOP=1 \
            -c 'CREATE ROLE glowloom_app NOLOGIN NOSUPERUSER' \
            -c 'CREATE ROLE glowloom_identity NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS' \
            -c 'CREATE ROLE glowloom_creation NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS' \
            -c 'CREATE ROLE glowloom_media NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS' \
            -c 'CREATE ROLE glowloom_execution NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS' \
            -c 'CREATE ROLE owner_b_identity_test LOGIN INHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS IN ROLE glowloom_identity' \
            -c 'CREATE ROLE owner_b_creation_test LOGIN INHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS IN ROLE glowloom_creation' \
            -c 'CREATE ROLE owner_b_media_test LOGIN INHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS IN ROLE glowloom_media' \
            -c 'CREATE ROLE owner_b_execution_test LOGIN INHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS IN ROLE glowloom_execution' \
            -c 'CREATE ROLE glowloom_agent LOGIN NOSUPERUSER' \
            -c 'CREATE ROLE canvas_test_runtime LOGIN INHERIT NOSUPERUSER IN ROLE glowloom_app'
          # These suites initialize their own schema.
          for database in schema_probe glowloom_subject_source_ci glowloom_subject_storage_ci glowloom_subject_storage_package_ci; do
            psql "$admin_dsn" -X -v ON_ERROR_STOP=1 -c "CREATE DATABASE $database"
          done
          psql "$admin_dsn" -X --single-transaction -v ON_ERROR_STOP=1 -f db/schema.sql -f db/data.sql
          for database in glowloom_governance glowloom_catalog glowloom_subject_alignment_ci glowloom_subject_storage_script_ci glowloom_app_scope_test glowloom_business_test glowloom_agent_canvas_test glowloom_agent_shot_ci_test glowloom_shot_pipeline_ci_test glowloom_boundary_test glowloom_tasks_test glowloom_maintenance_test glowloom_receipt glowloom_gateway_test glowloom_ai_rebuild_test glowloom_studio_inputs_test glowloom_owner_ci_test notifications_ci_test; do
            psql "$admin_dsn" -X -v ON_ERROR_STOP=1 -c "CREATE DATABASE $database"
            psql "postgres://postgres@127.0.0.1:5432/$database?sslmode=disable" -X --single-transaction -v ON_ERROR_STOP=1 -f db/schema.sql -f db/data.sql
          done
          psql "$admin_dsn" -X -v ON_ERROR_STOP=1 -c 'CREATE DATABASE glowloom_document_ci_test'
          psql postgres://postgres@127.0.0.1:5432/glowloom_document_ci_test -X --single-transaction -v ON_ERROR_STOP=1 -f db/schema.sql -f db/data.sql
      - name: Build the production Agent used by boundary tests
        working-directory: agent
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Verify multimedia references, style library, storyboards and Agent eval fixtures
        env:
          GLOWLOOM_TEST_WORKSPACE_DB_DSN: postgres://postgres@127.0.0.1:5432/glowloom_studio_inputs_test?sslmode=disable
          GLOWLOOM_TEST_MEDIA_STORE_DB_DSN: postgres://postgres@127.0.0.1:5432/glowloom_studio_inputs_test?sslmode=disable
          GLOWLOOM_TEST_AGENT_BUSINESS_DB_DSN: postgres://postgres@127.0.0.1:5432/glowloom_studio_inputs_test?sslmode=disable
          GLOWLOOM_TEST_AGENT_CANVAS_DB_DSN: postgres://postgres@127.0.0.1:5432/glowloom_studio_inputs_test?sslmode=disable
        run: >-
          go test -race -count=1
          ./tests/workspace ./tests/media ./tests/agentbusiness ./tests/agent/modelgateway ./tests/prompt
          -run 'TestStyleLibrary|TestMediaReference|TestConversationAdmission|TestVideoLink|TestPublicVideo|TestReferenceVisual|TestChatAllows|TestConversationDocument|TestPersonalUploadNilRequest|TestUploadPublishes|TestPersonalUploadPublishes|TestProjectAgentEvalFixtureDistinguishesResults|TestProjectRAGIndexesSearchesAndFencesOriginalReceipts|TestProjectEvidenceHTTPResolvesOnlyCurrentProjectSources|TestAgentStoryboardRealPostgresYjs|TestStoryboardAdoptionRealPostgresYjs'
      - name: Verify rebuilt AI core without skipped regressions
        run: |
          set -o pipefail
          go test -race -count=1 -json ./tests/aigateway | tee "$RUNNER_TEMP/ai-core.jsonl"
          if jq -s -e 'any(.[]; .Action == "skip")' "$RUNNER_TEMP/ai-core.jsonl"; then
            echo "Rebuilt AI core must run every test with PostgreSQL and FFmpeg"
            exit 1
          fi
      - name: Run backend Race tests
        run: |
          go build -o "$RUNNER_TEMP/cos-fixture" ./tests/storagefixture/cmd/cosfixture
          "$RUNNER_TEMP/cos-fixture" &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 1 \
            --head --header 'Authorization: q-sign-algorithm=sha1&fixture=readiness' http://127.0.0.1:19000/
          # Document originals use their own nonowner database and synthetic bucket.
          jq -n --arg endpoint http://127.0.0.1:19000 --arg bucket glowloom-receipt-test \
            --arg access_key "$GLOWLOOM_TEST_STORAGE_AK" --arg secret_key "$GLOWLOOM_TEST_STORAGE_SK" \
            '{endpoint: $endpoint, bucket: $bucket, access_key: $access_key, secret_key: $secret_key, region: "us-east-1"}' \
            > "$RUNNER_TEMP/document-storage.json"
          document_storage_config="$(jq '.profiles["test-main"].bucket = "glowloom-receipt-test"' <<< "$GLOWLOOM_OBJECT_STORAGE_CONFIG")"
          GLOWLOOM_TEST_DOCUMENT_DB_DSN='postgres://postgres@127.0.0.1:5432/glowloom_document_ci_test?sslmode=disable&options=-c%20role%3Dglowloom_app' \
          GLOWLOOM_TEST_DOCUMENT_OWNER_DSN='postgres://postgres@127.0.0.1:5432/glowloom_document_ci_test?sslmode=disable' \
          GLOWLOOM_TEST_RECEIPT_STORAGE_CONFIG="$RUNNER_TEMP/document-storage.json" \
          GLOWLOOM_OBJECT_STORAGE_CONFIG="$document_storage_config" \
            go test -race -count=1 ./tests/media -run '^TestDocumentHTTPNonownerActualPrivateOriginalReviewReplayAndAttachment$'
          GLOWLOOM_TEST_OBJECT_STORAGE=1 go test -race -count=1 -timeout=15m ./...

  agent:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_DB: glowloom_agent_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d glowloom_agent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GLOWLOOM_TEST_SKILL_RUNTIME_DB_DSN: postgres://glowloom_agent@127.0.0.1:5432/glowloom_agent_test?sslmode=disable
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: agent/package.json
          cache: true
          cache_dependency_path: agent/pnpm-lock.yaml
      - name: Initialize the restricted-role Agent test database
        working-directory: backend
        run: |
          psql postgres://postgres@127.0.0.1:5432/glowloom_agent_test -X -v ON_ERROR_STOP=1 \
            -c 'CREATE ROLE glowloom_app NOLOGIN NOSUPERUSER' \
            -c 'CREATE ROLE glowloom_identity NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS' \
            -c 'CREATE ROLE glowloom_creation NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS' \
            -c 'CREATE ROLE glowloom_media NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS' \
            -c 'CREATE ROLE glowloom_execution NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS' \
            -c 'CREATE ROLE glowloom_agent LOGIN NOSUPERUSER'
          psql postgres://postgres@127.0.0.1:5432/glowloom_agent_test -X --single-transaction -v ON_ERROR_STOP=1 -f db/schema.sql -f db/data.sql
      - run: pnpm install --frozen-lockfile
      - name: Check the Mastra Agent
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm eval
          pnpm build

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
          cache: true
          cache_dependency_path: |
            frontend/pnpm-lock.yaml
            canvas/pnpm-lock.yaml
      - name: Build the shared canvas package
        working-directory: canvas
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm build
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Lint the Canvas editor
        run: pnpm exec eslint src/components/canvas-editor
      - name: Run frontend business tests
        run: pnpm exec vitest run --maxWorkers=2
      - name: Build frontend and check TypeScript
        env:
          GLOWLOOM_BACKEND_ORIGIN: http://127.0.0.1:1123
        run: pnpm exec next build --webpack
      - name: Check built standalone collaboration transport
        run: node --test tests/production/standalone-live-proxy.mjs
