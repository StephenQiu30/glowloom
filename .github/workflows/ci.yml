name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Keep backend tests outside production source
        run: |
          test_file="$(find . -type f -name '*_test.go' ! -path './tests/*' -print -quit)"
          if [ -n "$test_file" ]; then
            echo "Go tests must live under backend/tests/: $test_file" >&2
            exit 1
          fi
      - run: go install golang.org/x/tools/cmd/goimports@v0.50.0
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - run: go install github.com/google/wire/cmd/wire@v0.7.0
      - run: golangci-lint run ./...
      - run: govulncheck ./...
      - name: Check generated dependencies
        run: |
          wire ./internal/app
          goimports -local github.com/StephenQiu30/glowloom-server/backend -w internal/app/wire_gen.go
          git diff --exit-code -- internal/app/wire_gen.go
      - name: Run backend Race tests
        run: go test -race -count=1 -v ./...

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm install --global pnpm@12.4.2
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Keep frontend tests outside production source
        run: |
          test_file="$(find src -type f \( -name '*.test.ts' -o -name '*.test.tsx' -o -name '*.spec.ts' -o -name '*.spec.tsx' \) -print -quit)"
          if [ -n "$test_file" ]; then
            echo "Frontend tests must live under frontend/tests/: $test_file" >&2
            exit 1
          fi
      - run: pnpm exec eslint .
      - run: pnpm exec next typegen
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec vitest run
      - run: pnpm exec next build
